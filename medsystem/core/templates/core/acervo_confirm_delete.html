{% extends 'core/base.html' %}

{% block title %}Excluir {{ tipo }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-2xl shadow-lg border border-gray-200 p-8 text-center">
    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-2xl">
        <i class="fas fa-trash"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Excluir {{ tipo }}?</h1>
    <p class="text-gray-700 mb-1">Tem certeza que deseja excluir <strong>"{{ object }}"</strong>?</p>
    <p class="text-sm text-red-600 mb-6">{{ aviso }} Esta ação não pode ser desfeita.</p>
    <form method="post" class="flex justify-center gap-3">
        {% csrf_token %}
        <a href="{{ voltar }}" class="px-5 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition">Cancelar</a>
        <button type="submit" class="px-5 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-medium">Excluir</button>
    </form>
</div>
{% endblock %}
