name: Code Style Check (Black)

on:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/code-style.yml'
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  black-check:
    runs-on: ubuntu-latest
    name: Check Code Formatting with Black
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black
          
      - name: Check code formatting with Black
        run: |
          echo "🎨 Checking code formatting with Black..."
          black --check medsystem/
