name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Django checks
      run: |
        cd medsystem
        python manage.py check
    
    - name: Check for deprecations
      run: |
        cd medsystem
        python -W error::DeprecationWarning manage.py check
    
    - name: Run deprecation detector
      run: |
        python check_deprecations.py

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@e44258b109568baa0df60ed515909fc6c72cba92
      with:
        organization: ${{ secrets.SONAR_ORG }}
        token: ${{ secrets.SONAR_TOKEN }}
        projectKey: AgnesGB_SantuarioVital
        projectName: SantuarioVital
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run code smell detector
      run: |
        cd medsystem
        SECRET_KEY=ci DJANGO_SETTINGS_MODULE=medsystem.settings python -m pylint --rcfile=../.pylintrc core/views.py core/models.py
    
    - name: Run migrations
      run: |
        cd medsystem
        python manage.py migrate --run-syncdb
    
    - name: Run tests
      run: |
        cd medsystem
        python manage.py test core
    
    - name: Collect static files (dry-run)
      run: |
        cd medsystem
        python manage.py collectstatic --noinput --dry-run --clear
      continue-on-error: true

    - name: Instalar Graphviz
      run: |
        sudo apt-get update && sudo apt-get install -y graphviz
        pip install pyparsing pydot

    - name: Gerar Diagrama de Classes UML
      run: |
        cd medsystem
        python manage.py graph_models -a -o diagrama_classes.png
      env:
        SECRET_KEY: "chave-fake-so-para-ci"
        DEBUG: "True"

    - name: Fazer upload do Diagrama de Classes
      uses: actions/upload-artifact@v4
      with:
        name: diagrama-de-classes
        path: medsystem/diagrama_classes.png
    
    - name: Check code with flake8 (optional linting)
      run: |
        pip install flake8
        # Ignore migrations and settings
        flake8 medsystem/core --max-line-length=120 --exclude=migrations,settings.py
      continue-on-error: true