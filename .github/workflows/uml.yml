name: Gerar Diagrama UML

on:
  push:
    branches: [main, master]
    paths:
      - '**/models.py'
      - '**/models/**/*.py'
      - 'generate_uml.py'
  pull_request:
    paths:
      - '**/models.py'
  workflow_dispatch: # permite rodar manualmente

jobs:
  uml:
    name: Gerar diagrama de classes
    runs-on: ubuntu-latest

    permissions:
      contents: write   # necessário para fazer commit do HTML gerado

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar diagrama UML
        run: python generate_uml.py . docs/uml/classes.html

      - name: Salvar como artefato do pipeline
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagram
          path: docs/uml/classes.html
          retention-days: 30

      - name: Commit automático do diagrama (só no push para main)
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/uml/classes.html
          git diff --cached --quiet || git commit -m "docs: atualiza diagrama UML de classes [skip ci]"
          git push
