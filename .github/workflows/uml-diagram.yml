name: Generate UML Class Diagram

on:
  push:
    paths:
      - "medsystem/core/models.py"
      - "requirements.txt"
      - "generate_uml_diagram.py"
      - ".github/workflows/uml-diagram.yml"
  pull_request:
    paths:
      - "medsystem/core/models.py"
      - "requirements.txt"
      - "generate_uml_diagram.py"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-diagram:
    runs-on: ubuntu-latest
    name: Generate UML Diagram

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate UML diagram
        run: |
          echo "📊 Generating UML class diagram..."
          python generate_uml_diagram.py

      - name: Check generated files
        run: |
          echo "✅ Generated files:"
          ls -lh docs/classes.*

      - name: Upload diagram artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagram
          path: docs/classes.*
          retention-days: 30
